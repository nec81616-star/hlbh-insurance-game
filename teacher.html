<style>

.road{position:absolute;background:var(--road);border:6px solid var(--curb);z-index:2;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}.road.h{left:-2%;right:-2%;height:78px;transform:translateY(-50%)}.road.v{top:-2%;bottom:-2%;width:78px;transform:translateX(-50%)}.road.top{top:26%}.road.bottom{top:74%}.road.left{left:25%}.road.right{left:75%}.road.alleyH{left:25%;right:25%;top:50%;height:42px;transform:translateY(-50%);border-width:4px;background:#676e7c;z-index:2}.road.alleyV{top:26%;bottom:26%;left:50%;width:42px;transform:translateX(-50%);border-width:4px;background:#676e7c;z-index:2}.road.h:after,.road.alleyH:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed rgba(255,255,255,.65)}.road.v:after,.road.alleyV:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed rgba(255,255,255,.65)}
.cross{position:absolute;width:86px;height:86px;background:#596171;border:4px solid #343b48;transform:translate(-50%,-50%);z-index:3}.cross:before,.cross:after{content:"";position:absolute;opacity:.6}.cross:before{left:8px;right:8px;top:9px;height:5px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px)}.cross:after{top:8px;bottom:8px;left:9px;width:5px;background:repeating-linear-gradient(180deg,#fff 0 8px,transparent 8px 14px)}.xA{left:25%;top:26%}.xB{left:75%;top:26%}.xC{left:25%;top:74%}.xD{left:75%;top:74%}
.building{position:absolute;z-index:4;border:4px solid #334c70;box-shadow:0 7px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-size:30px;font-weight:1000;color:white;overflow:hidden}.building:before{content:"";position:absolute;inset:8px;opacity:.55;pointer-events:none}.apt{background:#6f8fb9;border-radius:12px 12px 3px 3px}.apt:before{background:repeating-linear-gradient(90deg,#dff7ff 0 9px,transparent 9px 18px)}.shop{background:#dc856c;border-radius:5px}.shop:before{top:auto;height:14px;background:repeating-linear-gradient(90deg,#fff 0 12px,#ef5350 12px 24px);opacity:.8}.office{background:#55769f;border-radius:3px}.office:before{background:repeating-linear-gradient(0deg,transparent 0 11px,#bceaff 11px 17px)}.school{background:#d1a052;border-radius:10px}.school:after{content:"";position:absolute;top:-18px;width:70%;height:30px;background:#a95345;transform:rotate(4deg);z-index:-1}.hospital{background:#e6eef8;color:#d63e48;border-color:#7a8aa4;border-radius:10px}.park{background:#3ea95b;border-color:#267340;border-radius:20px;font-size:36px}.gas{background:#6f7385;border-radius:6px}.cafe{background:#a56e4e;border-radius:18px 18px 6px 6px}
.b1{left:4%;top:5%;width:14%;height:12%}.b2{left:34%;top:5%;width:12%;height:13%}.b3{left:56%;top:5%;width:13%;height:12%}.b4{right:4%;top:5%;width:14%;height:14%}.b5{left:5%;top:37%;width:13%;height:14%}.b6{right:5%;top:38%;width:13%;height:13%}.b7{left:5%;bottom:5%;width:14%;height:13%}.b8{left:34%;bottom:5%;width:12%;height:14%}.b9{left:56%;bottom:5%;width:13%;height:13%}.b10{right:4%;bottom:5%;width:14%;height:14%}
.statusbar{position:absolute;left:12px;top:12px;z-index:30;background:#fff5b9;border:4px solid var(--deep);border-radius:14px;padding:8px 11px;font-weight:1000;box-shadow:0 5px 0 rgba(16,41,90,.18)}.hostbadge{position:absolute;right:12px;top:12px;z-index:30;background:#e9f8ec;border:4px solid var(--deep);border-radius:13px;padding:7px 10px;font-size:12px;font-weight:1000}
.lightPod{position:absolute;z-index:22;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:12px;background:#172033;border:3px solid #0c1830;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.22)}.lightPod span{display:grid;place-items:center;border-radius:7px;background:#303a4c;color:#c9d2df;font-size:9px;font-weight:1000}.lightPod .green{background:#3cd85d;color:#082b12;box-shadow:0 0 10px #3cd85d}.lightPod .red{background:#ff4a4a;color:#4e0909;box-shadow:0 0 10px #ff4a4a}.lightPod .yellow{background:#ffd84b;color:#573e00;box-shadow:0 0 10px #ffd84b}.lA{left:20.8%;top:20.5%}.lB{left:79.2%;top:20.5%}.lC{left:20.8%;top:79.5%}.lD{left:79.2%;top:79.5%}
.car{position:absolute;width:47px;height:66px;transform:translate(-50%,-50%) rotate(var(--rot));z-index:12;will-change:left,top,transform;pointer-events:none}.car.moto{width:28px;height:58px;z-index:13}.sprite{position:absolute;inset:0;border:4px solid #142b58;border-radius:15px;background:var(--c);box-shadow:0 7px 8px rgba(0,0,0,.25)}.car.moto .sprite{left:6px;right:6px;border-radius:14px}.sprite:before{content:"";position:absolute;left:15%;right:15%;top:13%;height:22%;background:#dff7ff;border:3px solid #142b58;border-radius:7px}.car.moto .sprite:before{height:14%}.sprite:after{content:"";position:absolute;left:23%;right:23%;bottom:10%;height:18%;background:#273c60;border-radius:6px}.name{position:absolute;left:50%;top:-22px;transform:translateX(-50%) rotate(calc(-1 * var(--rot)));white-space:nowrap;background:#fff4ad;border:2px solid #765600;border-radius:7px;padding:2px 5px;font-size:10px;font-weight:1000;color:#5d4300}.ambient{opacity:.72;z-index:10}.ambient .name{display:none}.boom{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(calc(-1 * var(--rot)));font-size:42px;z-index:20}.car.accident .boom{display:block;animation:boom .5s infinite alternate}.car.accident .sprite{filter:grayscale(.45)}.car.offstage{opacity:0}@keyframes boom{to{transform:translate(-50%,-50%) rotate(calc(-1 * var(--rot))) scale(1.25)}}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.metric{border:2px solid #7694bf;border-radius:10px;background:#edf5ff;padding:7px;text-align:center}.metric small{display:block;font-weight:900;color:#678}.metric strong{font-size:19px}.ranking{max-height:470px;overflow:auto;display:flex;flex-direction:column;gap:6px}.rank{display:grid;grid-template-columns:35px 1fr auto;gap:7px;align-items:center;border:2px solid #9ab0cf;background:#f4f8ff;border-radius:10px;padding:7px}.rank .no{font-size:20px;font-weight:1000;text-align:center;color:#315ea5}.rank b{display:block;font-size:13px}.rank small{font-weight:900;color:#667995}.rank .score{font-size:19px;font-weight:1000;color:#d06c00}.feed{height:120px;overflow:auto;display:flex;flex-direction:column;gap:5px}.log{border:2px solid #9bb0ce;border-radius:8px;background:#edf4ff;padding:6px;font-size:11px;font-weight:900}.log.acc{background:#ffe2e2;border-color:#db7a7a}.log.good{background:#e5f8e9;border-color:#73bf83}#setupMsg{padding:8px;background:#fff0ba;border:2px solid #c18b1c;border-radius:9px;font-weight:900;margin-bottom:8px}
.qoverlay{position:fixed;inset:0;background:rgba(7,17,39,.82);z-index:100;display:grid;place-items:center;padding:18px}.qbox{width:min(1050px,96vw);max-height:94vh;overflow:auto;background:#fffef6;border:6px solid var(--deep);border-radius:24px;box-shadow:0 18px 45px rgba(0,0,0,.38);padding:20px}.qtop{display:flex;justify-content:space-between;gap:15px;align-items:start}.qtop h2{margin:0;font-size:30px}.accdetail{background:#ffe0e0;border:3px solid #cc5050;border-radius:14px;padding:11px 13px;margin:12px 0;font-weight:900;line-height:1.65}.question{font-size:24px;font-weight:1000;margin:14px 0}.answerbar{display:grid;grid-template-columns:42px minmax(0,1fr) 66px;gap:8px;align-items:center;margin:9px 0}.letter{font-size:22px;font-weight:1000;text-align:center}.track{position:relative;height:48px;border:3px solid #294f8d;border-radius:12px;background:#edf4ff;overflow:hidden}.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#5ac8ff,#3187ed);transition:.28s}.track.correct{border-color:#2e9b4a;background:#e9f9ec}.track.correct .fill{background:linear-gradient(90deg,#7eea87,#37bd51)}.track.wrongpick{border-color:#cf5353}.label{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;font-weight:1000;z-index:2}.pct{text-align:right;font-weight:1000;font-size:16px}.qfoot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.answered{font-weight:1000;color:#365982}.explain{margin-top:12px;padding:11px;border-radius:12px;background:#e8f8eb;border:3px solid #65b875;font-weight:900;line-height:1.55}
@media(max-width:1020px){.layout{grid-template-columns:1fr}.map{min-height:680px}}
</style></head>
<body>
<div class="top"><div><h1>🚦 險中求生城市交通大作戰</h1></div><div class="room">房號 <span id="roomShow">----</span></div><div class="controls"><input id="roomInput" maxlength="4" inputmode="numeric" placeholder="房號"><button id="createBtn">建立房間</button><button id="startBtn" class="green" disabled>▶ 全員發車</button><button id="stopBtn" class="orange" disabled>⏹ 結束本局</button><button id="resetBtn" class="red" disabled>重設</button></div></div>
<div class="layout">
<div class="panel"><div class="phead">城市道路</div><div class="map" id="map">
<div class="grass"></div>
<div class="road h top"></div><div class="road h bottom"></div><div class="road v left"></div><div class="road v right"></div><div class="road alleyH"></div><div class="road alleyV"></div>
<div class="cross xA"></div><div class="cross xB"></div><div class="cross xC"></div><div class="cross xD"></div>
<div class="building school b1">🏫</div><div class="building cafe b2">☕</div><div class="building office b3">🏢</div><div class="building hospital b4">✚</div><div class="building park b5">🌳</div><div class="building shop b6">🏪</div><div class="building gas b7">⛽</div><div class="building apt b8">🏠</div><div class="building office b9">🏬</div><div class="building shop b10">🛒</div>
<div class="lightPod lA" data-node="A"><span class="ns">NS</span><span class="ew">EW</span></div><div class="lightPod lB" data-node="B"><span class="ns">NS</span><span class="ew">EW</span></div><div class="lightPod lC" data-node="C"><span class="ns">NS</span><span class="ew">EW</span></div><div class="lightPod lD" data-node="D"><span class="ns">NS</span><span class="ew">EW</span></div>
<div class="statusbar" id="mapStatus">建立房間後等待學生加入</div><div class="hostbadge" id="hostBadge">老師未建立房間</div><div id="cars"></div>
</div></div>
<div><div class="panel" style="margin-bottom:12px"><div class="phead">積分排行</div><div class="pbody"><div id="setupMsg">尚未建立房間</div><div class="metrics"><div class="metric"><small>玩家</small><strong id="mPlayers">0</strong></div><div class="metric"><small>READY</small><strong id="mReady">0</strong></div><div class="metric"><small>事故人數</small><strong id="mAcc">0</strong></div></div><div class="ranking" id="ranking"></div></div></div><div class="panel"><div class="phead">事件</div><div class="pbody"><div class="feed" id="feed"></div></div></div></div>
</div>
<div class="qoverlay hidden" id="qOverlay"><div class="qbox"><div class="qtop"><h2>💥 城市交通事故</h2><div class="answered" id="qCount">0 / 0 已作答</div></div><div class="accdetail" id="accDetail"></div><div class="question" id="qPrompt"></div><div id="bars"></div><div class="qfoot"><div class="answered" id="answeredText"></div><div><button id="revealBtn" class="orange">公布答案</button><button id="continueBtn" class="green hidden">繼續行車</button></div></div><div class="explain hidden" id="explain"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="game-data.js"></script>
<script>
let db,auth,room='',roomRef=null,heartbeatTimer=null,players={},sim={},ambient=[],running=false,paused=false,lastTs=0,lastSideRender=0,lastSafetyAward=0,collisionAt=0,collisionDone=false,collisionIds=[],collisionNode='A',collisionAmbientId=null,currentQuestion=null,affectedCount=0;
const $=id=>document.getElementById(id);
const NODES={
 W1:{x:-7,y:26,boundary:true},A:{x:25,y:26,signal:true},M1:{x:50,y:26},B:{x:75,y:26,signal:true},E1:{x:107,y:26,boundary:true},
 W2:{x:-7,y:74,boundary:true},C:{x:25,y:74,signal:true},M2:{x:50,y:74},D:{x:75,y:74,signal:true},E2:{x:107,y:74,boundary:true},
 N1:{x:25,y:-7,boundary:true},H:{x:25,y:50},S1:{x:25,y:107,boundary:true},N2:{x:75,y:-7,boundary:true},J:{x:75,y:50},S2:{x:75,y:107,boundary:true},I:{x:50,y:50}
};
const EDGES=[['W1','A'],['A','M1'],['M1','B'],['B','E1'],['W2','C'],['C','M2'],['M2','D'],['D','E2'],['N1','A'],['A','H'],['H','C'],['C','S1'],['N2','B'],['B','J'],['J','D'],['D','S2'],['M1','I'],['I','M2'],['H','I'],['I','J']];
const ADJ={};for(const [a,b] of EDGES){(ADJ[a]||(ADJ[a]=[])).push(b);(ADJ[b]||(ADJ[b]=[])).push(a)}
const MAIN_SIGNALS=new Set(['A','B','C','D']);
const SIGNAL_OFFSET={A:0,B:6000,C:6000,D:0};
function configOK(){return window.GAME_FIREBASE_CONFIG&&!String(GAME_FIREBASE_CONFIG.apiKey).includes('PASTE_')}
async function init(){if(!configOK()){$('setupMsg').textContent='請先完成 Firebase 設定';$('createBtn').disabled=true;return}firebase.initializeApp(GAME_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();await auth.signInAnonymously()}
function rand(a,b){return a+Math.random()*(b-a)}function pick(a){return a[Math.floor(Math.random()*a.length)]}function log(msg,type=''){let d=document.createElement('div');d.className='log '+type;d.textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false})+'　'+msg;$('feed').prepend(d)}
function nodeVec(a,b){let A=NODES[a],B=NODES[b],dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;return{dx,dy,len,ux:dx/len,uy:dy/len}}
function axisFor(a,b){let v=nodeVec(a,b);return Math.abs(v.dx)>Math.abs(v.dy)?'EW':'NS'}
function signalPhase(nodeId,now=Date.now()){let cycle=12000,t=(now+SIGNAL_OFFSET[nodeId])%cycle;if(t<5000)return{NS:'green',EW:'red'};if(t<6000)return{NS:'yellow',EW:'red'};if(t<11000)return{NS:'red',EW:'green'};return{NS:'red',EW:'yellow'}}
function renderSignals(){document.querySelectorAll('.lightPod').forEach(p=>{let ph=signalPhase(p.dataset.node);for(const ax of ['ns','ew']){let el=p.querySelector('.'+ax),c=ph[ax.toUpperCase()];el.className=ax+' '+c}})}
function chooseTurn(prev,node,cands){if(cands.length===1)return cands[0];let vin=nodeVec(prev,node),scored=cands.map(n=>{let v=nodeVec(node,n),dot=vin.ux*v.ux+vin.uy*v.uy,cross=vin.ux*v.uy-vin.uy*v.ux;let kind=dot>.65?'straight':cross>0?'right':'left';let w=kind==='straight'?5:kind==='right'?3:2;return{n,w,kind}}),total=scored.reduce((s,x)=>s+x.w,0),r=Math.random()*total;for(const x of scored){r-=x.w;if(r<=0)return x.n}return scored[0].n}
function nextNode(actor,nodeId,prevId){let c=(ADJ[nodeId]||[]).filter(n=>n!==prevId);if(!c.length)c=ADJ[nodeId]||[];return chooseTurn(prevId,nodeId,c)}
function laneOffset(actor,from,to){let v=nodeVec(from,to),alley=(from==='I'||to==='I'||['M1','M2','H','J'].includes(from)&&['M1','M2','H','J'].includes(to));let mag=actor.vehicleType==='moto'?(alley?1.55:2.7):(alley?.8:1.45);return{x:-v.uy*mag,y:v.ux*mag}}
function actorPos(actor){if(actor.forcePos)return actor.forcePos;let A=NODES[actor.from],B=NODES[actor.to],t=actor.t,off=laneOffset(actor,actor.from,actor.to);return{x:A.x+(B.x-A.x)*t+off.x,y:A.y+(B.y-A.y)*t+off.y,rot:Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI+90}}
function createCar(id,p,isAmbient=false){let el=document.getElementById('car_'+id);if(el)return el;el=document.createElement('div');el.id='car_'+id;el.className='car '+(p.vehicleType==='moto'?'moto ':'')+(isAmbient?'ambient':'');el.innerHTML=`<div class="name">${p.name||''}</div><div class="sprite"></div><div class="boom">💥</div>`;el.style.setProperty('--c',p.color||'#3b82f6');$('cars').appendChild(el);return el}
function renderCars(){let now=Date.now();for(const [id,p] of Object.entries(players)){if(!p.ready)continue;let a=sim[id];if(!a)continue;let el=createCar(id,p,false),pos=actorPos(a);el.style.left=pos.x+'%';el.style.top=pos.y+'%';el.style.setProperty('--rot',pos.rot+'deg');el.style.setProperty('--c',p.color||'#3b82f6');el.className='car '+(p.vehicleType==='moto'?'moto ':'')+(a.status==='accident'?'accident ':'')+(a.hiddenUntil&&now<a.hiddenUntil?'offstage':'');el.querySelector('.name').textContent=p.name||'玩家'}
 for(const a of ambient){let el=createCar(a.id,a,true),pos=actorPos(a);el.style.left=pos.x+'%';el.style.top=pos.y+'%';el.style.setProperty('--rot',pos.rot+'deg');el.style.setProperty('--c',a.color);el.className='car '+(a.vehicleType==='moto'?'moto ':'')+'ambient '+(a.status==='accident'?'accident ':'')+(a.hiddenUntil&&now<a.hiddenUntil?'offstage':'')}
}
function makeActor(id,p,index,isAmbient=false){let starts=[['W1','A'],['E1','B'],['N1','A'],['S1','C'],['W2','C'],['E2','D'],['N2','B'],['S2','D'],['A','M1'],['C','M2'],['H','I'],['J','I']];let [from,to]=starts[index%starts.length];return{id,from,to,t:.05+(index%3)*.22,status:'driving',speed:isAmbient?rand(32,64):Math.max(5,Number(p.speed||40)),vehicleType:p.vehicleType||'car',color:p.color||'#b8c2cf',forcePos:null,hiddenUntil:0,boundaryWait:0,isAmbient}}
function setupAmbient(){ambient=[];for(let i=0;i<10;i++){let v=i%4===0?'moto':'car',a=makeActor('amb'+i,{vehicleType:v,color:['#b8c2cf','#f5a623','#7f8cff','#ef7373','#56c596','#d88ce8'][i%6],speed:rand(30,62)},i+3,true);ambient.push(a);createCar(a.id,a,true)}}
function allActors(){let out=[];for(const [id,p] of Object.entries(players)){let a=sim[id];if(a&&p.ready)out.push(a)}return out.concat(ambient)}
function speedUnits(actor){return 3.6+Math.min(160,Math.max(0,Number(actor.speed||40)))*.11}
function edgeKey(a){return a.from+'>'+a.to}
function minGapUnits(a,b){return(a.vehicleType==='moto'&&b.vehicleType==='moto')?4.0:(a.vehicleType==='moto'||b.vehicleType==='moto')?5.0:6.2}
function nodeBusy(nodeId,selfId){return allActors().some(a=>a.id!==selfId&&a.status==='driving'&&a.from===nodeId&&a.t<.16)}
function canEnterSignal(actor){let node=actor.to;if(!MAIN_SIGNALS.has(node))return true;let ph=signalPhase(node),ax=axisFor(actor.from,node);return ph[ax]==='green'}
function advanceActors(dt){let actors=allActors(),now=Date.now();
 for(const a of actors){if(a.status!=='driving')continue;if(a.boundaryWait&&now<a.boundaryWait)continue;if(a.boundaryWait&&now>=a.boundaryWait){a.boundaryWait=0;a.hiddenUntil=now+120;a.t=.01}
   let v=nodeVec(a.from,a.to),step=speedUnits(a)*(dt/1000)/v.len,aNext=a.t+step;if(aNext>.88&&MAIN_SIGNALS.has(a.to)&&!canEnterSignal(a))aNext=Math.min(aNext,.88);if(aNext>.92&&ADJ[a.to]?.length>=3&&nodeBusy(a.to,a.id))aNext=Math.min(aNext,.90);a.nextT=aNext}
 let groups={};for(const a of actors){if(a.status!=='driving')continue;(groups[edgeKey(a)]||(groups[edgeKey(a)]=[])).push(a)}
 for(const g of Object.values(groups)){g.sort((a,b)=>b.t-a.t);let front=null;for(const a of g){let nt=a.nextT??a.t;if(front){let len=nodeVec(a.from,a.to).len,gap=minGapUnits(a,front)/len;nt=Math.min(nt,front.t-gap)}a.t=Math.max(a.t,nt);front=a}}
 for(const a of actors){if(a.status!=='driving'||a.t<1)continue;let prev=a.from,node=a.to;if(NODES[node].boundary){a.from=node;a.to=(ADJ[node]||[])[0];a.t=0;a.boundaryWait=now+rand(550,1100);a.hiddenUntil=a.boundaryWait+120;continue}let nxt=nextNode(a,node,prev);a.from=node;a.to=nxt;a.t=0.01}
}
function scoreRank(){return Object.entries(players).filter(([,p])=>p.ready).sort((a,b)=>(b[1].score||0)-(a[1].score||0))}
function renderSide(){let arr=Object.entries(players),ready=arr.filter(([,p])=>p.ready).length;$('mPlayers').textContent=arr.length;$('mReady').textContent=ready;$('mAcc').textContent=affectedCount;$('ranking').innerHTML=scoreRank().map(([id,p],i)=>`<div class="rank"><div class="no">${i+1}</div><div><b>${p.name||'玩家'}｜${p.roleName||'準備中'}</b><small>${p.vehicleType?GAME.colorName(p.color)+GAME.getVehicle(p.vehicleType).name:'未選車'}｜${p.speed??'-'} km/h｜答對 ${p.insuranceCorrect||0}</small></div><div class="score">${p.score||0}</div></div>`).join('');let all=arr.length>0&&ready===arr.length&&!running&&!collisionDone;$('startBtn').disabled=!all;$('mapStatus').textContent=paused?'事故題作答中':running?'城市車流持續行駛中':arr.length?`${ready}/${arr.length} READY`:'等待學生加入'}
function riskWeight(p){let sp=Number(p.speed||0),w=1+(p.scenarioPressure||0)*1.1+(p.scenarioDistraction||0)*1.4;if(sp<=30)w+=.3;else if(sp<=50)w+=1;else if(sp<=60)w+=2;else if(sp<=80)w+=4;else if(sp<100)w+=7;else w+=11;w+=(6-(p.mobility||2))*.6;return Math.max(.5,w)}
function weightedSample(entries,count){let pool=[...entries],out=[];while(pool.length&&out.length<count){let total=pool.reduce((s,[,p])=>s+riskWeight(p),0),r=Math.random()*total,idx=0;for(;idx<pool.length;idx++){r-=riskWeight(pool[idx][1]);if(r<=0)break}out.push(pool[Math.min(idx,pool.length-1)]);pool.splice(Math.min(idx,pool.length-1),1)}return out}
function planCollision(){let entries=Object.entries(players).filter(([,p])=>p.ready);if(!entries.length)return;let count=1+Math.floor(Math.random()*Math.min(3,entries.length)),chosen=weightedSample(entries,count).map(x=>x[0]);collisionIds=count===1?[chosen[0],'__NPC__']:chosen;collisionNode=pick(['A','B','C','D']);collisionAt=Date.now()+Math.round(rand(28000,52000));collisionDone=false;affectedCount=count;log(`本局將隨機出現一次互撞事故，影響 ${count} 名學生`)}
function medicalFor(p){let speed=Math.max(20,Number(p.speed||40)),prot=Number(p.protection||2);return Math.round((16000+speed*700)*(1.28-prot*.11)/1000)*1000}function damageFor(p){let speed=Math.max(20,Number(p.speed||40));return Math.round((12000+speed*800)*(p.vehicleType==='moto'?.65:1)/1000)*1000}
function questionTemplate(summary){let set=[{prompt:'依強制汽車責任保險制度，本次事故中哪一類損失屬於法定人身給付範圍？',options:['人員傷害醫療費用','汽車與機車維修費','手機與隨身物品損失','道路設施修復費'],correctIndex:0,explanation:'強制險的法定給付重點是傷害醫療、失能與死亡；車輛等財物損失不屬法定人身給付項目。'},{prompt:'如果肇事汽車無法查究，受害人的基本人身保障可向哪個機制請求補償？',options:['汽車交通事故特別補償基金','車商保固','道路救援公司','一般財產保險公會'],correctIndex:0,explanation:'符合法定情形時，受害人可向汽車交通事故特別補償基金請求補償。'},{prompt:'酒駕造成事故時，對受害人的強制險給付何者較正確？',options:['仍依法對受害人給付，之後可能依法代位求償','一律完全不給付','只賠車輛維修費','由受害人自行負擔'],correctIndex:0,explanation:'酒駕等法定情形並非讓受害人直接失去基本保障；保險人給付後可能依法代位求償。'}];let q=pick(set);return{id:'q_'+Date.now(),accidentSummary:summary,prompt:q.prompt,options:q.options,correctIndex:q.correctIndex,explanation:q.explanation,revealed:false,closed:false,answers:{},createdAt:Date.now()}}
async function triggerCollision(){if(collisionDone||paused)return;collisionDone=true;paused=true;let node=NODES[collisionNode],realIds=collisionIds.filter(x=>x!=='__NPC__'),lines=[],updates={status:'question'};collisionAmbientId=null;let coords=[{x:node.x-1.8,y:node.y,rot:90},{x:node.x+1.8,y:node.y,rot:-90},{x:node.x,y:node.y+1.8,rot:0}];for(let i=0;i<collisionIds.length;i++){let id=collisionIds[i],pos=coords[i%coords.length];if(id==='__NPC__'){let npc=ambient.find(a=>a.status==='driving')||ambient[0];if(npc){collisionAmbientId=npc.id;npc.status='accident';npc.forcePos=pos;lines.push(`環境車（NPC）｜汽車｜時速 50 km/h｜模擬醫療費 42,000 元｜車損 53,000 元`)}continue}let p=players[id],a=sim[id];if(!p||!a)continue;a.status='accident';a.forcePos=pos;let medical=medicalFor(p),damage=damageFor(p),loss=Math.max(4,Math.min(32,Math.round(medical/6500)));lines.push(`${p.name}｜${GAME.colorName(p.color)}${GAME.getVehicle(p.vehicleType).name}｜${p.speed} km/h｜模擬醫療費 ${medical.toLocaleString()} 元｜車損 ${damage.toLocaleString()} 元`);updates[`players/${id}/health`]=Math.max(0,Number(p.health??100)-loss);updates[`players/${id}/pressure`]=Math.min(100,Number(p.pressure||0)+10);updates[`players/${id}/score`]=Math.max(0,Number(p.score||0)-50);updates[`players/${id}/accidentCount`]=Number(p.accidentCount||0)+1;updates[`players/${id}/status`]='accident';updates[`players/${id}/currentEvent`]='💥 發生互撞事故';updates[`players/${id}/lastFeedback`]='事故扣除 50 分；防護力影響模擬傷害程度。'}let q=questionTemplate(lines.join('\n'));updates.globalQuestion=q;await roomRef.update(updates);log(`${realIds.map(id=>players[id]?.name).filter(Boolean).join('、')||'測試玩家'} 發生互撞事故`,'acc');renderCars()}
function renderQuestion(){let q=currentQuestion;if(!q||q.closed){$('qOverlay').classList.add('hidden');return}$('qOverlay').classList.remove('hidden');$('accDetail').innerHTML=(q.accidentSummary||'').replace(/\n/g,'<br>');$('qPrompt').textContent=q.prompt||'';let answers=q.answers||{},total=Object.values(players).filter(p=>p.ready).length,count=Object.keys(answers).length;$('qCount').textContent=`${count} / ${total} 已作答`;$('answeredText').textContent=total?`全班作答率 ${Math.round(count/total*100)}%`:'等待作答';$('bars').innerHTML=(q.options||[]).map((o,i)=>{let c=Object.values(answers).filter(a=>Number(a.option)===i).length,pct=total?Math.round(c/total*100):0,cls=q.revealed?(i===Number(q.correctIndex)?'correct':'wrongpick'):'';return `<div class="answerbar"><div class="letter">${String.fromCharCode(65+i)}</div><div class="track ${cls}"><div class="fill" style="width:${pct}%"></div><div class="label">${o}</div></div><div class="pct">${pct}%</div></div>`}).join('');$('revealBtn').classList.toggle('hidden',!!q.revealed);$('continueBtn').classList.toggle('hidden',!q.revealed);$('explain').classList.toggle('hidden',!q.revealed);$('explain').textContent=q.revealed?q.explanation||'':''}
function setupRoomLifecycle(ref){if(heartbeatTimer)clearInterval(heartbeatTimer);ref.onDisconnect().remove();heartbeatTimer=setInterval(()=>ref.update({hostOnline:true,hostHeartbeat:firebase.database.ServerValue.TIMESTAMP}),5000);window.onbeforeunload=()=>{try{ref.child('hostOnline').set(false)}catch(e){}};$('hostBadge').textContent='🟢 老師在線'}
function watchRoom(){roomRef.child('players').on('value',snap=>{players=snap.val()||{};renderSide();renderCars()});roomRef.child('globalQuestion').on('value',s=>{currentQuestion=s.val();renderQuestion()});roomRef.child('status').on('value',s=>{let st=s.val();if(st==='finished'){running=false;paused=false;$('mapStatus').textContent='⏹️ 本局已結束'}})}
$('createBtn').onclick=async()=>{let code=$('roomInput').value.trim();if(!/^\d{4}$/.test(code))code=String(Math.floor(1000+Math.random()*9000));let ref=db.ref(`rooms/${code}`),old=await ref.once('value');if(old.exists()){let online=old.child('hostOnline').val(),beat=Number(old.child('hostHeartbeat').val()||0);if(online&&Date.now()-beat<18000){$('setupMsg').textContent='這個房號目前已有老師使用，請換一個房號';return}}if(roomRef){try{await roomRef.remove()}catch(e){}try{await roomRef.onDisconnect().cancel()}catch(e){}}room=code;roomRef=ref;$('roomInput').value=code;$('roomShow').textContent=code;await roomRef.set({status:'waiting',hostUid:auth.currentUser.uid,hostOnline:true,hostHeartbeat:firebase.database.ServerValue.TIMESTAMP,createdAt:firebase.database.ServerValue.TIMESTAMP});setupRoomLifecycle(roomRef);$('resetBtn').disabled=false;$('setupMsg').textContent='房間已建立；關閉老師頁面後房間會自動失效';$('cars').innerHTML='';sim={};setupAmbient();watchRoom();renderSignals();log('建立房間 '+code,'good')};
$('resetBtn').onclick=async()=>{if(!roomRef)return;running=false;paused=false;sim={};players={};collisionDone=false;collisionIds=[];affectedCount=0;currentQuestion=null;$('cars').innerHTML='';$('feed').innerHTML='';setupAmbient();await roomRef.set({status:'waiting',hostUid:auth.currentUser.uid,hostOnline:true,hostHeartbeat:firebase.database.ServerValue.TIMESTAMP,createdAt:firebase.database.ServerValue.TIMESTAMP});setupRoomLifecycle(roomRef);log('房間已重設','good')};
function initialPlacement(entries){let out={},starts=[['W1','A'],['E1','B'],['N1','A'],['S1','C'],['W2','C'],['E2','D'],['N2','B'],['S2','D'],['A','M1'],['C','M2'],['H','I'],['J','I']],slots=[.18,.46,.74],occupied=[];for(const a of ambient)occupied.push({from:a.from,to:a.to,t:a.t});entries.forEach(([id,p],i)=>{let chosen=null;for(let k=0;k<starts.length&&!chosen;k++){let [from,to]=starts[(i+k)%starts.length];for(const t of slots){let busy=occupied.some(o=>o.from===from&&o.to===to&&Math.abs(o.t-t)<.16);if(!busy){chosen={from,to,t};break}}}if(!chosen)chosen={from:'W1',to:'A',t:.12};let a=makeActor(id,p,i,false);a.from=chosen.from;a.to=chosen.to;a.t=chosen.t;out[id]=a;occupied.push(chosen)});return out}
$('startBtn').onclick=async()=>{let arr=Object.entries(players);if(!arr.length||!arr.every(([,p])=>p.ready))return;sim=initialPlacement(arr);let updates={status:'running',globalQuestion:null,startedAt:firebase.database.ServerValue.TIMESTAMP};arr.forEach(([id])=>{updates[`players/${id}/status`]='driving';updates[`players/${id}/score`]=0;updates[`players/${id}/health`]=100;updates[`players/${id}/pressure`]=0;updates[`players/${id}/accidentCount`]=0;updates[`players/${id}/insuranceCorrect`]=0;updates[`players/${id}/currentEvent`]='🚦 行駛中';updates[`players/${id}/lastFeedback`]=null});await roomRef.update(updates);running=true;paused=false;lastTs=performance.now();lastSafetyAward=Date.now();$('stopBtn').disabled=false;$('startBtn').disabled=true;planCollision();log('全員發車；車輛將在四個十字路口與巷道間持續行駛','good');requestAnimationFrame(tick)};
$('stopBtn').onclick=async()=>{if(!roomRef)return;running=false;paused=false;$('stopBtn').disabled=true;await roomRef.child('status').set('finished');log('老師結束本局','good')};
function safetyPoints(speed){speed=Number(speed||0);if(speed<=20)return 5;if(speed<=30)return 8;if(speed<=50)return 10;if(speed<=60)return 8;if(speed<=80)return 4;return 0}
async function awardSafety(){let updates={};for(const [id,p] of Object.entries(players)){if(!p.ready)continue;updates[`players/${id}/score`]=(p.score||0)+safetyPoints(p.speed)}if(Object.keys(updates).length)await roomRef.update(updates)}
$('revealBtn').onclick=async()=>{let q=currentQuestion;if(!q||q.revealed)return;let answers=q.answers||{},updates={'globalQuestion/revealed':true};for(const [id,p] of Object.entries(players)){let a=answers[id],correct=a&&Number(a.option)===Number(q.correctIndex);if(correct){updates[`players/${id}/score`]=Number(p.score||0)+100;updates[`players/${id}/insuranceCorrect`]=Number(p.insuranceCorrect||0)+1;updates[`players/${id}/lastFeedback`]='✅ 強制險題答對，+100 分'}else if(a){updates[`players/${id}/lastFeedback`]='❌ 本題未答對'}}await roomRef.update(updates);log('公布答案並結算全班積分','good')};
$('continueBtn').onclick=async()=>{let updates={status:'running','globalQuestion/closed':true},node=collisionNode;for(const id of collisionIds){if(id==='__NPC__')continue;let a=sim[id];if(!a)continue;a.forcePos=null;a.status='driving';a.from=node;a.to=pick((ADJ[node]||[]));a.t=.08;updates[`players/${id}/status`]='driving';updates[`players/${id}/currentEvent`]='🚗 事故處理完成，重新上路'}if(collisionAmbientId){let a=ambient.find(x=>x.id===collisionAmbientId);if(a){a.forcePos=null;a.status='driving';a.from=node;a.to=pick(ADJ[node]||[]);a.t=.12}}await roomRef.update(updates);setTimeout(()=>roomRef.child('globalQuestion').remove(),500);paused=false;log('事故題結束，事故車從事故路口繼續行駛','good')};
async function tick(ts){if(!running)return;let dt=Math.min(90,Math.max(0,ts-(lastTs||ts)));lastTs=ts;renderSignals();if(!paused){advanceActors(dt);if(!collisionDone&&Date.now()>=collisionAt)triggerCollision();if(Date.now()-lastSafetyAward>=20000){lastSafetyAward=Date.now();awardSafety()}if(ts-lastSideRender>700){lastSideRender=ts;renderSide()}}renderCars();requestAnimationFrame(tick)}
init();
</script></body></html>
