<!DOCTYPE html>
<html lang="zh-Hant">

<style>
:root{--deep:#10295a;--green:#35c65b;--yellow:#ffd84b;--red:#ef4444;--blue:#2e8cff}
*{box-sizing:border-box}body{margin:0;background:#72d7ff;font-family:"Microsoft JhengHei",sans-serif;color:#183562;overflow-x:hidden}.hidden{display:none!important}
.top{background:linear-gradient(#ffe976,#ffb61d);border-bottom:5px solid var(--deep);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top h1{margin:0;font-size:25px}.room{font-size:25px;font-weight:1000;background:white;border:4px solid var(--deep);border-radius:14px;padding:6px 12px}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls input{width:94px;padding:9px;border:3px solid var(--deep);border-radius:10px;font-size:17px;font-weight:900}
button{position:relative;overflow:hidden;border:4px solid var(--deep);border-radius:13px;padding:9px 12px;font-weight:1000;color:white;background:linear-gradient(#6fd6ff,#268dff);box-shadow:0 5px 0 rgba(16,41,90,.25);cursor:pointer;transition:.15s}button:not(:disabled){animation:pulse 2s ease-in-out infinite}button:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed;animation:none}button:hover:not(:disabled){transform:translateY(-2px)}button:active:not(:disabled){transform:translateY(3px)}@keyframes pulse{50%{filter:brightness(1.09)}}.green{background:linear-gradient(#80ef84,#2ebf4f)}.red{background:linear-gradient(#ff8585,#e33c3c)}.orange{background:linear-gradient(#ffc363,#ee8517)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;padding:12px;min-height:calc(100vh - 84px)}.panel{background:#fffef6;border:4px solid var(--deep);border-radius:19px;box-shadow:0 7px 0 rgba(16,41,90,.2);overflow:hidden}.phead{background:linear-gradient(#8bef82,#35c657);border-bottom:4px solid var(--deep);padding:9px 12px;font-size:18px;font-weight:1000}.pbody{padding:9px}
.map{position:relative;min-height:720px;background:#70c968;overflow:hidden}.corner{position:absolute;background:linear-gradient(#9ee977,#75ca5e);border:4px solid #4f9745}.c1{left:0;top:0;width:31%;height:31%}.c2{right:0;top:0;width:31%;height:31%}.c3{left:0;bottom:0;width:31%;height:31%}.c4{right:0;bottom:0;width:31%;height:31%}.building{position:absolute;background:#6682a9;border:4px solid #334c70;border-radius:7px 7px 0 0;box-shadow:0 7px 0 rgba(0,0,0,.12)}.building:after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,#dff7ff 0 8px,transparent 8px 16px);opacity:.65}.b1{left:5%;top:5%;width:17%;height:18%}.b2{right:4%;top:7%;width:20%;height:16%;background:#d7836a}.b3{left:5%;bottom:5%;width:19%;height:17%;background:#d1a052}.b4{right:5%;bottom:5%;width:16%;height:20%;background:#6e8db8}
.roadV{position:absolute;left:31%;right:31%;top:-4%;bottom:-4%;background:#596171;border-left:7px solid #343b48;border-right:7px solid #343b48}.roadH{position:absolute;top:31%;bottom:31%;left:-4%;right:-4%;background:#596171;border-top:7px solid #343b48;border-bottom:7px solid #343b48}.dashV{position:absolute;left:50%;top:0;bottom:0;border-left:4px dashed rgba(255,255,255,.72)}.dashH{position:absolute;top:50%;left:0;right:0;border-top:4px dashed rgba(255,255,255,.72)}.crossBox{position:absolute;left:31%;right:31%;top:31%;bottom:31%;border:4px solid rgba(255,216,75,.7);z-index:1;pointer-events:none}.crossBox:before,.crossBox:after{content:"";position:absolute;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 22px);opacity:.55}.crossBox:before{left:-30%;right:-30%;top:10%;height:5px}.crossBox:after{left:-30%;right:-30%;bottom:10%;height:5px}
.statusbar{position:absolute;left:14px;top:14px;z-index:20;background:#fff5b9;border:4px solid var(--deep);border-radius:14px;padding:8px 11px;font-weight:1000;box-shadow:0 5px 0 rgba(16,41,90,.18)}
.car{position:absolute;width:48px;height:68px;transform:translate(-50%,-50%) rotate(var(--rot));transition:left .28s linear,top .28s linear;z-index:6}.car.moto{width:30px;height:62px}.sprite{position:absolute;inset:0;border:4px solid #142b58;border-radius:16px;background:var(--c);box-shadow:0 7px 8px rgba(0,0,0,.25)}.car.moto .sprite{left:6px;right:6px;border-radius:15px}.sprite:before{content:"";position:absolute;left:15%;right:15%;top:13%;height:23%;background:#dff7ff;border:3px solid #142b58;border-radius:7px}.car.moto .sprite:before{height:15%}.sprite:after{content:"";position:absolute;left:23%;right:23%;bottom:10%;height:18%;background:#273c60;border-radius:6px}.name{position:absolute;left:50%;top:-22px;transform:translateX(-50%) rotate(calc(-1 * var(--rot)));white-space:nowrap;background:#fff4ad;border:2px solid #765600;border-radius:7px;padding:2px 5px;font-size:10px;font-weight:1000;color:#5d4300}.ambient{opacity:.72;z-index:4}.ambient .name{display:none}.boom{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(calc(-1 * var(--rot)));font-size:42px;z-index:9}.car.accident .boom{display:block;animation:boom .5s infinite alternate}.car.accident .sprite{filter:grayscale(.45)}@keyframes boom{to{transform:translate(-50%,-50%) rotate(calc(-1 * var(--rot))) scale(1.25)}}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.metric{border:2px solid #7694bf;border-radius:10px;background:#edf5ff;padding:7px;text-align:center}.metric small{display:block;font-weight:900;color:#678}.metric strong{font-size:19px}.ranking{max-height:445px;overflow:auto;display:flex;flex-direction:column;gap:6px}.rank{display:grid;grid-template-columns:35px 1fr auto;gap:7px;align-items:center;border:2px solid #9ab0cf;background:#f4f8ff;border-radius:10px;padding:7px}.rank .no{font-size:20px;font-weight:1000;text-align:center;color:#315ea5}.rank b{display:block;font-size:13px}.rank small{font-weight:900;color:#667995}.rank .score{font-size:19px;font-weight:1000;color:#d06c00}.feed{height:150px;overflow:auto;display:flex;flex-direction:column;gap:5px}.log{border:2px solid #9bb0ce;border-radius:8px;background:#edf4ff;padding:6px;font-size:11px;font-weight:900}.log.acc{background:#ffe2e2;border-color:#db7a7a}.log.good{background:#e5f8e9;border-color:#73bf83}#setupMsg{padding:8px;background:#fff0ba;border:2px solid #c18b1c;border-radius:9px;font-weight:900;margin-bottom:8px}
.qoverlay{position:fixed;inset:0;background:rgba(7,17,39,.82);z-index:100;display:grid;place-items:center;padding:18px}.qbox{width:min(1050px,96vw);max-height:94vh;overflow:auto;background:#fffef6;border:6px solid var(--deep);border-radius:24px;box-shadow:0 18px 45px rgba(0,0,0,.38);padding:20px}.qtop{display:flex;justify-content:space-between;gap:15px;align-items:start}.qtop h2{margin:0;font-size:30px}.accdetail{background:#ffe0e0;border:3px solid #cc5050;border-radius:14px;padding:11px 13px;margin:12px 0;font-weight:900;line-height:1.65}.question{font-size:24px;font-weight:1000;margin:14px 0}.answerbar{display:grid;grid-template-columns:42px minmax(0,1fr) 66px;gap:8px;align-items:center;margin:9px 0}.letter{font-size:22px;font-weight:1000;text-align:center}.track{position:relative;height:48px;border:3px solid #294f8d;border-radius:12px;background:#edf4ff;overflow:hidden}.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#5ac8ff,#3187ed);transition:.28s}.track.correct{border-color:#2e9b4a;background:#e9f9ec}.track.correct .fill{background:linear-gradient(90deg,#7eea87,#37bd51)}.track.wrongpick{border-color:#cf5353}.label{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;font-weight:1000;z-index:2}.pct{text-align:right;font-weight:1000;font-size:16px}.qfoot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.answered{font-weight:1000;color:#365982}.explain{margin-top:12px;padding:11px;border-radius:12px;background:#e8f8eb;border:3px solid #65b875;font-weight:900;line-height:1.55}
@media(max-width:1020px){.layout{grid-template-columns:1fr}.map{min-height:640px}}
</style></head>
<body>
<div class="top"><div><h1>🚦 強制險城市大冒險</h1></div><div class="room">房號 <span id="roomShow">----</span></div><div class="controls"><input id="roomInput" maxlength="4" inputmode="numeric" placeholder="房號"><button id="createBtn">建立房間</button><button id="startBtn" class="green" disabled>▶ 全員發車</button><button id="stopBtn" class="orange" disabled>⏹ 結束本局</button><button id="resetBtn" class="red" disabled>重設</button></div></div>
<div class="layout"><div class="panel"><div class="phead">城市道路</div><div class="map" id="map"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="building b4"></div><div class="roadV"><div class="dashV"></div></div><div class="roadH"><div class="dashH"></div></div><div class="crossBox"></div><div class="statusbar" id="mapStatus">建立房間後等待學生加入</div><div id="cars"></div></div></div>
<div><div class="panel" style="margin-bottom:12px"><div class="phead">積分排行</div><div class="pbody"><div id="setupMsg">尚未建立房間</div><div class="metrics"><div class="metric"><small>玩家</small><strong id="mPlayers">0</strong></div><div class="metric"><small>READY</small><strong id="mReady">0</strong></div><div class="metric"><small>事故學生</small><strong id="mAcc">0</strong></div></div><div class="ranking" id="ranking"></div></div></div><div class="panel"><div class="phead">事件紀錄</div><div class="pbody"><div class="feed" id="feed"></div></div></div></div></div>
<div class="qoverlay hidden" id="qOverlay"><div class="qbox"><div class="qtop"><h2>💥 交通事故發生！</h2><div id="qCount" class="room" style="font-size:18px">0 / 0 已作答</div></div><div class="accdetail" id="accDetail"></div><div class="question" id="qPrompt"></div><div id="bars"></div><div class="qfoot"><div class="answered" id="answeredText"></div><div><button id="revealBtn" class="green">公布答案</button><button id="continueBtn" class="orange hidden">繼續行車</button></div></div><div id="explain" class="explain hidden"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="game-data.js"></script>
<script>
let db,auth,room='',players={},sim={},ambient=[],running=false,paused=false,lastTs=0,lastWrite=0,lastSafetyAward=0,collisionAt=0,collisionDone=false,collisionIds=[],currentQuestion=null,affectedCount=0;const $=id=>document.getElementById(id);const routes=['S2N','N2S','W2E','E2W'];
function configOK(){return window.GAME_FIREBASE_CONFIG&&!String(GAME_FIREBASE_CONFIG.apiKey).includes('PASTE_')}async function init(){if(!configOK()){$('setupMsg').textContent='請先完成 Firebase 設定';$('createBtn').disabled=true;return}firebase.initializeApp(GAME_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();await auth.signInAnonymously()}
function log(msg,type=''){let d=document.createElement('div');d.className='log '+type;d.textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false})+'　'+msg;$('feed').prepend(d)}function hash(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}function rand(a,b){return a+Math.random()*(b-a)}function pick(a){return a[Math.floor(Math.random()*a.length)]}
function routePos(route,p,lane){let off=(lane-1)*3.1;if(route==='S2N')return{x:55+off,y:106-p*112,rot:0};if(route==='N2S')return{x:45+off,y:-6+p*112,rot:180};if(route==='W2E')return{x:-6+p*112,y:55+off,rot:90};return{x:106-p*112,y:45+off,rot:-90}}
function nextRoute(old){let arr=routes.filter(r=>r!==old);return pick(arr)}
function createCar(id,p,isAmbient=false){let el=document.getElementById('car_'+id);if(el)return el;el=document.createElement('div');el.id='car_'+id;el.className='car '+(p.vehicleType==='moto'?'moto ':'')+(isAmbient?'ambient':'');el.innerHTML=`<div class="name">${p.name||''}</div><div class="sprite"></div><div class="boom">💥</div>`;el.style.setProperty('--c',p.color||'#3b82f6');$('cars').appendChild(el);return el}
function setupAmbient(){ambient=[];for(let i=0;i<10;i++){let route=routes[i%4],obj={id:'amb'+i,route,lane:i%3,progress:(i*.17)%1,speed:rand(32,70),vehicleType:i%3===0?'moto':'car',color:['#b8c2cf','#f5a623','#7f8cff','#ef7373','#56c596'][i%5]};ambient.push(obj);createCar(obj.id,obj,true)}}
function renderCars(){Object.entries(players).forEach(([id,p])=>{if(!p.ready)return;let s=sim[id];if(!s)return;let el=createCar(id,p,false),pos=s.forcePos||routePos(s.route,s.progress,s.lane);el.style.left=pos.x+'%';el.style.top=pos.y+'%';el.style.setProperty('--rot',(pos.rot||0)+'deg');el.style.setProperty('--c',p.color||'#3b82f6');el.className='car '+(p.vehicleType==='moto'?'moto ':'')+(s.status==='accident'?'accident':'');el.querySelector('.name').textContent=p.name||'玩家'});ambient.forEach(a=>{let el=createCar(a.id,a,true),pos=routePos(a.route,a.progress,a.lane);el.style.left=pos.x+'%';el.style.top=pos.y+'%';el.style.setProperty('--rot',pos.rot+'deg')})}
function scoreRank(){return Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0))}
function renderSide(){let arr=Object.entries(players),ready=arr.filter(([,p])=>p.ready).length;$('mPlayers').textContent=arr.length;$('mReady').textContent=ready;$('mAcc').textContent=affectedCount;$('ranking').innerHTML=scoreRank().map(([id,p],i)=>`<div class="rank"><div class="no">${i+1}</div><div><b>${p.name||'玩家'}｜${p.roleName||'準備中'}</b><small>${p.vehicleType?GAME.colorName(p.color)+GAME.getVehicle(p.vehicleType).name:'未選車'}｜${p.speed??'-'} km/h｜答對 ${p.insuranceCorrect||0}</small></div><div class="score">${p.score||0}</div></div>`).join('');let all=arr.length>0&&ready===arr.length&&!running&&!collisionDone;$('startBtn').disabled=!all;$('mapStatus').textContent=paused?'事故題作答中':running?'車流持續行駛中':arr.length?`${ready}/${arr.length} READY`:'等待學生加入'}
function riskWeight(p){let sp=Number(p.speed||0),w=1+(p.scenarioPressure||0)*1.1+(p.scenarioDistraction||0)*1.4;if(sp<=30)w+=.3;else if(sp<=50)w+=1;else if(sp<=60)w+=2;else if(sp<=80)w+=4;else if(sp<100)w+=7;else w+=11;w+=(6-(p.mobility||2))*.6;return Math.max(.5,w)}
function weightedSample(entries,count){let pool=[...entries],out=[];while(pool.length&&out.length<count){let total=pool.reduce((s,[,p])=>s+riskWeight(p),0),r=Math.random()*total,idx=0;for(;idx<pool.length;idx++){r-=riskWeight(pool[idx][1]);if(r<=0)break}out.push(pool[Math.min(idx,pool.length-1)]);pool.splice(Math.min(idx,pool.length-1),1)}return out}
function planCollision(){let entries=Object.entries(players).filter(([,p])=>p.ready);if(!entries.length){collisionIds=[];return}if(entries.length===1){collisionIds=[entries[0][0],'__NPC__']}else{let count=entries.length>=3&&Math.random()<.48?3:2;collisionIds=weightedSample(entries,count).map(x=>x[0])}collisionAt=Date.now()+Math.round(rand(18000,35000));collisionDone=false;affectedCount=collisionIds.filter(x=>x!=='__NPC__').length;log(`本局事故將影響 ${affectedCount} 名學生（依風險加權隨機）`)}
function watchRoom(){db.ref(`rooms/${room}/players`).on('value',snap=>{players=snap.val()||{};Object.entries(players).forEach(([id,p])=>{if(p.ready&&!sim[id])sim[id]={route:routes[hash(id)%4],lane:hash(id)%3,progress:(hash(id)%70)/100,status:'driving',forcePos:null}});renderSide();renderCars()});db.ref(`rooms/${room}/globalQuestion`).on('value',s=>{currentQuestion=s.val();renderQuestion()});db.ref(`rooms/${room}/status`).on('value',s=>{let st=s.val();if(st==='finished'){running=false;paused=false;$('mapStatus').textContent='⏹️ 本局已結束'}})}
$('createBtn').onclick=async()=>{let code=$('roomInput').value.trim();if(!/^\d{4}$/.test(code))code=String(Math.floor(1000+Math.random()*9000));room=code;$('roomInput').value=code;$('roomShow').textContent=code;await db.ref(`rooms/${room}`).set({status:'waiting',createdAt:firebase.database.ServerValue.TIMESTAMP});$('resetBtn').disabled=false;$('setupMsg').textContent='房間已建立';setupAmbient();watchRoom();log('建立房間 '+code,'good')};
$('resetBtn').onclick=async()=>{if(!room)return;running=false;paused=false;sim={};players={};collisionDone=false;collisionIds=[];affectedCount=0;currentQuestion=null;$('cars').innerHTML='';$('feed').innerHTML='';setupAmbient();await db.ref(`rooms/${room}`).set({status:'waiting',createdAt:firebase.database.ServerValue.TIMESTAMP});log('房間已重設','good')};
$('startBtn').onclick=async()=>{let arr=Object.entries(players);if(!arr.length||!arr.every(([,p])=>p.ready))return;sim={};let updates={status:'running',globalQuestion:null,startedAt:firebase.database.ServerValue.TIMESTAMP};arr.forEach(([id,p],i)=>{sim[id]={route:routes[i%4],lane:i%3,progress:(i*.13)%1,status:'driving',forcePos:null};updates[`players/${id}/status`]='driving';updates[`players/${id}/score`]=0;updates[`players/${id}/health`]=100;updates[`players/${id}/pressure`]=0;updates[`players/${id}/accidentCount`]=0;updates[`players/${id}/insuranceCorrect`]=0;updates[`players/${id}/currentEvent`]='🚦 行駛中';updates[`players/${id}/lastFeedback`]=null});await db.ref(`rooms/${room}`).update(updates);running=true;paused=false;lastTs=performance.now();lastSafetyAward=Date.now();$('stopBtn').disabled=false;$('startBtn').disabled=true;planCollision();log('全員發車；車流進入無限循環','good');requestAnimationFrame(tick)};
$('stopBtn').onclick=async()=>{if(!room)return;running=false;paused=false;$('stopBtn').disabled=true;await db.ref(`rooms/${room}/status`).set('finished');log('老師結束本局','good')};
function safetyPoints(speed){speed=Number(speed||0);if(speed<=20)return 5;if(speed<=30)return 8;if(speed<=50)return 10;if(speed<=60)return 8;if(speed<=80)return 4;return 0}
async function awardSafety(){let updates={};for(let [id,p] of Object.entries(players)){if(!p.ready)continue;updates[`players/${id}/score`]=(p.score||0)+safetyPoints(p.speed)}if(Object.keys(updates).length)await db.ref(`rooms/${room}`).update(updates)}
function updateAmbient(dt){ambient.forEach(a=>{a.progress+=dt*(a.speed/1500000);if(a.progress>=1){a.progress%=1;a.route=nextRoute(a.route);a.lane=Math.floor(Math.random()*3)}})}
function updatePlayers(dt){Object.entries(players).forEach(([id,p])=>{let s=sim[id];if(!s||s.status!=='driving')return;s.progress+=dt*(Math.max(5,Number(p.speed||0))/1500000);if(s.progress>=1){s.progress%=1;s.route=nextRoute(s.route);s.lane=Math.floor(Math.random()*3)}})}
function medicalFor(p){let speed=Math.max(20,Number(p.speed||40)),prot=Number(p.protection||2);return Math.round((16000+speed*700)*(1.28-prot*.11)/1000)*1000}function damageFor(p){let speed=Math.max(20,Number(p.speed||40));return Math.round((12000+speed*800)*(p.vehicleType==='moto'?.65:1)/1000)*1000}
function questionTemplate(summary){let set=[{prompt:'依強制汽車責任保險制度，本次事故中哪一類損失屬於法定人身給付範圍？',options:['人員傷害醫療費用','汽車與機車維修費','手機與隨身物品損失','道路設施修復費'],correctIndex:0,explanation:'強制險的法定給付重點是傷害醫療、失能與死亡；車輛等財物損失不屬這些法定人身給付項目。'},{prompt:'如果肇事汽車無法查究，受害人的基本人身保障可向哪個機制請求補償？',options:['汽車交通事故特別補償基金','車商保固','道路救援公司','一般財產保險公會'],correctIndex:0,explanation:'符合法定情形時，受害人可向汽車交通事故特別補償基金請求補償。'},{prompt:'酒駕造成事故時，對受害人的強制險給付何者較正確？',options:['仍依法對受害人給付，之後可能依法代位求償','一律完全不給付','只賠車輛維修費','由受害人自行負擔'],correctIndex:0,explanation:'酒駕等法定情形並非讓受害人直接失去基本保障；保險人給付後可能依法代位求償。'}];let q=pick(set);return{id:'q_'+Date.now(),accidentSummary:summary,prompt:q.prompt,options:q.options,correctIndex:q.correctIndex,explanation:q.explanation,revealed:false,closed:false,answers:{},createdAt:Date.now()}}
async function triggerCollision(){if(collisionDone||paused)return;collisionDone=true;paused=true;let realIds=collisionIds.filter(x=>x!=='__NPC__'),lines=[],updates={status:'question'};for(let i=0;i<collisionIds.length;i++){let id=collisionIds[i];if(id==='__NPC__'){lines.push(`測試車（NPC）｜汽車｜時速 50 km/h｜模擬醫療費 42,000 元｜車損 53,000 元`);continue}let p=players[id],s=sim[id];if(!p||!s)continue;s.status='accident';s.forcePos={x:50+(i-(collisionIds.length-1)/2)*3.4,y:50+(i%2?2:-2),rot:i%2?90:0};let medical=medicalFor(p),damage=damageFor(p),loss=Math.max(4,Math.min(32,Math.round(medical/6500)));lines.push(`${p.name}｜${GAME.colorName(p.color)}${GAME.getVehicle(p.vehicleType).name}｜${p.speed} km/h｜模擬醫療費 ${medical.toLocaleString()} 元｜車損 ${damage.toLocaleString()} 元`);updates[`players/${id}/health`]=Math.max(0,Number(p.health??100)-loss);updates[`players/${id}/pressure`]=Math.min(100,Number(p.pressure||0)+10);updates[`players/${id}/score`]=Math.max(0,Number(p.score||0)-50);updates[`players/${id}/accidentCount`]=Number(p.accidentCount||0)+1;updates[`players/${id}/status`]='accident';updates[`players/${id}/currentEvent`]='💥 發生互撞事故';updates[`players/${id}/lastFeedback`]='事故扣除 50 分；防護力會影響模擬傷害程度。'}let q=questionTemplate(lines.join('\n'));updates.globalQuestion=q;await db.ref(`rooms/${room}`).update(updates);log(`${realIds.map(id=>players[id]?.name).filter(Boolean).join('、')||'測試玩家'} 發生互撞事故`,'acc');renderCars()}
function renderQuestion(){let q=currentQuestion;if(!q||q.closed){$('qOverlay').classList.add('hidden');return}$('qOverlay').classList.remove('hidden');$('accDetail').innerHTML=(q.accidentSummary||'').replace(/\n/g,'<br>');$('qPrompt').textContent=q.prompt||'';let answers=q.answers||{},total=Object.values(players).filter(p=>p.ready).length,count=Object.keys(answers).length;$('qCount').textContent=`${count} / ${total} 已作答`;$('answeredText').textContent=total?`全班作答率 ${Math.round(count/total*100)}%`:'等待作答';$('bars').innerHTML=(q.options||[]).map((o,i)=>{let c=Object.values(answers).filter(a=>Number(a.option)===i).length,pct=total?Math.round(c/total*100):0,cls=q.revealed?(i===Number(q.correctIndex)?'correct':'wrongpick'):'';return `<div class="answerbar"><div class="letter">${String.fromCharCode(65+i)}</div><div class="track ${cls}"><div class="fill" style="width:${pct}%"></div><div class="label">${o}</div></div><div class="pct">${pct}%</div></div>`}).join('');$('revealBtn').classList.toggle('hidden',!!q.revealed);$('continueBtn').classList.toggle('hidden',!q.revealed);$('explain').classList.toggle('hidden',!q.revealed);$('explain').textContent=q.revealed?q.explanation||'':''}
$('revealBtn').onclick=async()=>{let q=currentQuestion;if(!q||q.revealed)return;let answers=q.answers||{},updates={'globalQuestion/revealed':true};for(let [id,p] of Object.entries(players)){let a=answers[id],correct=a&&Number(a.option)===Number(q.correctIndex);if(correct){updates[`players/${id}/score`]=Number(p.score||0)+100;updates[`players/${id}/insuranceCorrect`]=Number(p.insuranceCorrect||0)+1;updates[`players/${id}/lastFeedback`]='✅ 強制險題答對，+100 分'}else if(a){updates[`players/${id}/lastFeedback`]='❌ 本題未答對'}}await db.ref(`rooms/${room}`).update(updates);log('公布答案並結算全班積分','good')};
$('continueBtn').onclick=async()=>{let updates={status:'running','globalQuestion/closed':true};for(let id of collisionIds){if(id==='__NPC__')continue;let s=sim[id];if(!s)continue;s.status='driving';s.forcePos=null;s.route=pick(routes);s.lane=Math.floor(Math.random()*3);s.progress=0;updates[`players/${id}/status`]='driving';updates[`players/${id}/currentEvent`]='🚗 事故處理完成，重新上路'}await db.ref(`rooms/${room}`).update(updates);setTimeout(()=>db.ref(`rooms/${room}/globalQuestion`).remove(),600);paused=false;log('事故題結束，恢復車流','good')};
async function tick(ts){if(!running)return;let dt=Math.min(100,Math.max(0,ts-(lastTs||ts)));lastTs=ts;if(!paused){updatePlayers(dt);updateAmbient(dt);if(!collisionDone&&Date.now()>=collisionAt)triggerCollision();if(Date.now()-lastSafetyAward>=20000){lastSafetyAward=Date.now();awardSafety()}if(ts-lastWrite>700){lastWrite=ts;renderSide()}}renderCars();requestAnimationFrame(tick)}
init();
</script></body></html>
