<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>強制險城市大冒險｜老師端</title>
<style>
:root{--deep:#10295a;--blue:#2e8cff;--green:#35c65b;--yellow:#ffd84b;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:#72d7ff;font-family:"Microsoft JhengHei",sans-serif;color:#183562;overflow-x:hidden}
.top{background:linear-gradient(#ffe976,#ffb61d);border-bottom:5px solid var(--deep);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:27px}.room{font-size:28px;font-weight:1000;background:white;border:4px solid var(--deep);border-radius:15px;padding:7px 14px}
.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input{width:100px;padding:10px;border:3px solid var(--deep);border-radius:11px;font-size:18px;font-weight:900}
button{position:relative;overflow:hidden;border:4px solid var(--deep);border-radius:13px;padding:10px 13px;font-weight:1000;color:white;background:linear-gradient(#6fd6ff,#268dff);box-shadow:0 5px 0 rgba(16,41,90,.25);cursor:pointer;transition:.15s}
button:not(:disabled){animation:pulse 2s ease-in-out infinite}button:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed;animation:none}button:hover:not(:disabled){transform:translateY(-2px)}button:active:not(:disabled){transform:translateY(3px)}@keyframes pulse{50%{filter:brightness(1.09)}}.green{background:linear-gradient(#80ef84,#2ebf4f)}.red{background:linear-gradient(#ff8585,#e33c3c)}.orange{background:linear-gradient(#ffc363,#ee8517)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:12px;min-height:calc(100vh - 91px)}
.panel{background:#fffef6;border:4px solid var(--deep);border-radius:19px;box-shadow:0 7px 0 rgba(16,41,90,.2);overflow:hidden}.phead{background:linear-gradient(#8bef82,#35c657);border-bottom:4px solid var(--deep);padding:10px 13px;font-size:18px;font-weight:1000}.pbody{padding:10px}
.map{position:relative;min-height:700px;background:linear-gradient(#96e6ff 0 15%,#73cf69 15%);overflow:hidden}
.city{position:absolute;left:0;right:0;top:20px;height:90px;display:flex;align-items:end;justify-content:space-around}.building{width:9%;background:#58739a;border:4px solid #31486a;border-bottom:none}.building:nth-child(2n){background:#d4816b}.building:before{content:"";display:block;height:55px;background:repeating-linear-gradient(90deg,transparent 0 10px,#dff6ff 10px 18px,transparent 18px 27px);opacity:.75}
.road{position:absolute;left:13%;right:13%;top:105px;bottom:20px;background:#596171;border:7px solid #343b48;border-radius:18px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}
.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr)}.lane{border-right:3px dashed rgba(255,255,255,.55)}.lane:last-child{border-right:0}
.node{position:absolute;left:0;right:0;height:4px;background:rgba(255,216,75,.25);border-top:3px dashed rgba(255,216,75,.75)}.node span{position:absolute;right:6px;top:-20px;color:#fff6b8;font-size:11px;font-weight:1000;background:#313947;padding:2px 6px;border-radius:6px}
.car{position:absolute;width:54px;height:78px;transform:translate(-50%,-50%);transition:top .35s linear,left .35s ease;z-index:5}.car.moto{width:34px;height:72px}.sprite{position:absolute;inset:0;border:4px solid #142b58;border-radius:17px;background:var(--c);box-shadow:0 8px 8px rgba(0,0,0,.25)}.car.moto .sprite{left:7px;right:7px;border-radius:16px}.sprite:before{content:"";position:absolute;left:15%;right:15%;top:14%;height:22%;background:#dff7ff;border:3px solid #142b58;border-radius:8px}.car.moto .sprite:before{left:12%;right:12%;height:15%}.sprite:after{content:"";position:absolute;left:24%;right:24%;bottom:10%;height:18%;background:#273c60;border-radius:7px}
.name{position:absolute;left:50%;top:-23px;transform:translateX(-50%);white-space:nowrap;background:#fff4ad;border:2px solid #765600;border-radius:7px;padding:2px 5px;font-size:10px;font-weight:1000;color:#5d4300}.boom{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;z-index:8}.car.accident .boom{display:block;animation:boom .55s infinite alternate}.car.accident .sprite{filter:grayscale(.5)}@keyframes boom{to{transform:translate(-50%,-50%) scale(1.25)}}
.goal{position:absolute;left:13%;right:13%;top:116px;height:16px;background:repeating-linear-gradient(90deg,#fff 0 18px,#111 18px 36px);z-index:2}.start{position:absolute;left:13%;right:13%;bottom:35px;height:10px;background:#ffd84b;z-index:2}
.statusbar{position:absolute;left:18px;top:18px;z-index:20;background:#fff5b9;border:4px solid var(--deep);border-radius:14px;padding:9px 12px;font-weight:1000;box-shadow:0 5px 0 rgba(16,41,90,.18)}
.feed{height:270px;overflow:auto;display:flex;flex-direction:column;gap:6px}.log{border:2px solid #9bb0ce;border-radius:9px;background:#edf4ff;padding:7px;font-size:12px;font-weight:900}.log.acc{background:#ffe2e2;border-color:#db7a7a}.log.good{background:#e5f8e9;border-color:#73bf83}
.players{max-height:355px;overflow:auto;display:flex;flex-direction:column;gap:6px}.player{display:grid;grid-template-columns:1fr auto;gap:6px;border:2px solid #9ab0cf;background:#f4f8ff;border-radius:10px;padding:7px;font-size:12px}.player b{display:block;font-size:13px}.ready{color:#21813a;font-weight:1000}.notready{color:#b12b33;font-weight:1000}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.metric{border:2px solid #7694bf;border-radius:10px;background:#edf5ff;padding:8px;text-align:center}.metric small{display:block;font-weight:900;color:#678}.metric strong{font-size:19px}
#setupMsg{padding:9px;background:#fff0ba;border:2px solid #c18b1c;border-radius:9px;font-weight:900;margin-bottom:8px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.map{min-height:620px}}
</style>
</head>
<body>
<div class="top"><div><h1>🚦 強制險城市大冒險</h1></div><div class="room">房號 <span id="roomShow">----</span></div><div class="controls"><input id="roomInput" maxlength="4" inputmode="numeric" placeholder="房號"><button id="createBtn">建立房間</button><button id="startBtn" class="green" disabled>▶ 全員發車</button><button id="resetBtn" class="red" disabled>重設</button></div></div>
<div class="layout">
<div class="panel"><div class="phead">城市道路</div><div class="map" id="map">
<div class="city"><div class="building" style="height:48px"></div><div class="building" style="height:74px"></div><div class="building" style="height:58px"></div><div class="building" style="height:82px"></div><div class="building" style="height:54px"></div><div class="building" style="height:70px"></div></div>
<div class="statusbar" id="mapStatus">建立房間後等待學生加入</div><div class="road" id="road"><div class="lanes"><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div></div>
<div class="node" style="top:18%"><span>事件區</span></div><div class="node" style="top:34%"><span>事件區</span></div><div class="node" style="top:50%"><span>事件區</span></div><div class="node" style="top:66%"><span>事件區</span></div><div class="node" style="top:82%"><span>事件區</span></div>
</div><div class="goal"></div><div class="start"></div><div id="cars"></div></div></div>
<div>
<div class="panel" style="margin-bottom:12px"><div class="phead">即時狀態</div><div class="pbody"><div id="setupMsg">尚未建立房間</div><div class="metrics"><div class="metric"><small>玩家</small><strong id="mPlayers">0</strong></div><div class="metric"><small>READY</small><strong id="mReady">0</strong></div><div class="metric"><small>事故</small><strong id="mAcc">0</strong></div></div><div class="players" id="players"></div></div></div>
<div class="panel"><div class="phead">事件紀錄</div><div class="pbody"><div class="feed" id="feed"></div></div></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script><script src="game-data.js"></script>
<script>
let db,auth,room='',players={},sim={},running=false,lastTs=0,lastWrite=0,totalAcc=0;
const nodes=[.18,.34,.50,.66,.82],$=id=>document.getElementById(id);
function configOK(){return window.GAME_FIREBASE_CONFIG&&!String(GAME_FIREBASE_CONFIG.apiKey).includes('PASTE_')}
async function init(){if(!configOK()){$('setupMsg').textContent='請先完成 firebase-config.js 設定';$('createBtn').disabled=true;return}firebase.initializeApp(GAME_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();await auth.signInAnonymously()}
function log(msg,type=''){let d=document.createElement('div');d.className='log '+type;d.textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false})+'　'+msg;$('feed').prepend(d)}
function hashLane(id){let h=0;for(let c of id)h=(h*31+c.charCodeAt(0))>>>0;return h%6}
function createCar(id,p){let el=document.getElementById('car_'+id);if(el)return el;el=document.createElement('div');el.id='car_'+id;el.className='car '+(p.vehicleType==='moto'?'moto':'');el.innerHTML=`<div class="name">${p.name||'玩家'}</div><div class="sprite"></div><div class="boom">💥</div>`;el.style.setProperty('--c',p.color||'#3b82f6');$('cars').appendChild(el);return el}
function renderCars(){Object.entries(players).forEach(([id,p])=>{if(!p.ready)return;let s=sim[id]||{progress:p.progress||0,lane:hashLane(id),status:p.status||'ready'};let el=createCar(id,p);el.className='car '+(p.vehicleType==='moto'?'moto ':'')+(s.status==='accident'?'accident':'');el.style.left=(13+(s.lane+.5)*(74/6))+'%';el.style.top=(90-(s.progress||0)*76)+'%';el.querySelector('.name').textContent=p.name||'玩家';el.style.setProperty('--c',p.color||'#3b82f6')})}
function renderPlayers(){let arr=Object.entries(players);let ready=arr.filter(([,p])=>p.ready).length;$('mPlayers').textContent=arr.length;$('mReady').textContent=ready;$('mAcc').textContent=totalAcc;$('players').innerHTML=arr.map(([id,p])=>`<div class="player"><div><b>${p.name||'玩家'}｜${p.roleName||'未選角色'}</b>${p.vehicleType?GAME.colorName(p.color)+GAME.getVehicle(p.vehicleType).name:'尚未選車'}｜${p.speed??'-'} km/h</div><div class="${p.ready?'ready':'notready'}">${p.ready?'READY':'準備中'}</div></div>`).join('');let all=arr.length>0&&ready===arr.length&&!running;$('startBtn').disabled=!all;$('mapStatus').textContent=running?'行駛中':arr.length?`${ready}/${arr.length} READY`:'等待學生加入'}
function watchRoom(){db.ref(`rooms/${room}/players`).on('value',snap=>{players=snap.val()||{};Object.entries(players).forEach(([id,p])=>{if(!sim[id])sim[id]={progress:p.progress||0,lane:hashLane(id),status:p.status||'ready',processed:new Set(),resumeAt:0,correctIndex:null,questionHandled:false};let s=sim[id];if(p.pendingQuestion&&p.pendingQuestion.answerIndex!=null&&!s.questionHandled&&s.status==='accident')resolveQuestion(id,p,s)});renderPlayers();renderCars()});db.ref(`rooms/${room}/status`).on('value',s=>{let st=s.val();running=st==='running';if(st==='finished'){$('mapStatus').textContent='🏁 本局結束';$('startBtn').disabled=true}})}
$('createBtn').onclick=async()=>{let code=$('roomInput').value.trim();if(!/^\d{4}$/.test(code))code=String(Math.floor(1000+Math.random()*9000));room=code;$('roomInput').value=code;$('roomShow').textContent=code;await db.ref(`rooms/${room}`).set({status:'waiting',createdAt:firebase.database.ServerValue.TIMESTAMP});$('resetBtn').disabled=false;$('setupMsg').textContent='房間已建立，請學生輸入房號 '+code;log('建立房間 '+code,'good');watchRoom()};
$('resetBtn').onclick=async()=>{if(!room)return;running=false;sim={};players={};totalAcc=0;$('cars').innerHTML='';$('feed').innerHTML='';await db.ref(`rooms/${room}`).set({status:'waiting',createdAt:firebase.database.ServerValue.TIMESTAMP});log('房間已重設','good')};
$('startBtn').onclick=async()=>{if(!room)return;let arr=Object.entries(players);if(!arr.length||!arr.every(([,p])=>p.ready))return;sim={};totalAcc=0;let updates={status:'running',startedAt:firebase.database.ServerValue.TIMESTAMP};arr.forEach(([id,p],i)=>{sim[id]={progress:0,lane:i%6,status:'driving',processed:new Set(),resumeAt:0,correctIndex:null,questionHandled:false};updates[`players/${id}/progress`]=0;updates[`players/${id}/status`]='driving';updates[`players/${id}/currentEvent`]='🚦 出發！';updates[`players/${id}/pendingQuestion`]=null;updates[`players/${id}/questionResult`]=null});await db.ref(`rooms/${room}`).update(updates);running=true;lastTs=performance.now();log('全員發車！','good');requestAnimationFrame(tick)};
function eventRisk(p,event){let sp=Number(p.speed||0),risk=3+(p.scenarioPressure||0)*2+(p.scenarioDistraction||0)*3;if(sp<=30)risk+=1;else if(sp<=50)risk+=3;else if(sp<=60)risk+=6;else if(sp<=80)risk+=11;else if(sp<100)risk+=18;else risk+=28;
 if(event.id==='intersection')risk+=4+(sp>60?4:0);if(event.id==='traffic')risk+=(6-(p.mobility||2))*1.4;if(event.id==='rain')risk+=(6-(p.rainStability||2))*2;if(event.id==='roadwork')risk+=(6-(p.mobility||2))*1.7;if(event.id==='pedestrian')risk+=(6-(p.mobility||2))*1.5+(sp>60?5:0);return Math.max(2,Math.min(55,risk))}
function chooseEvent(){return GAME.roadEvents[Math.floor(Math.random()*GAME.roadEvents.length)]}
function processNode(id,p,s,nodeIndex){if(s.processed.has(nodeIndex)||s.status!=='driving')return;s.processed.add(nodeIndex);let ev=chooseEvent(),risk=eventRisk(p,ev);db.ref(`rooms/${room}/players/${id}/currentEvent`).set(`${ev.icon} ${ev.name}｜風險值 ${Math.round(risk)}`);log(`${p.name} 遇到 ${ev.name}（風險值 ${Math.round(risk)}）`);
 if(Math.random()*100<risk)triggerAccident(id,p,s,ev,risk)}
function rand(a,b){return a+Math.random()*(b-a)}function round1000(v){return Math.round(v/1000)*1000}
function questionTemplate(){let n=Math.floor(Math.random()*3);if(n===0)return{type:'coverage',prompt:'下列哪一項屬於強制汽車責任保險的法定給付項目？',options:['人員傷害醫療費用','汽車鈑金維修費','手機損壞','道路設施修復'],correctIndex:0,explanation:'強制險法定給付項目是傷害醫療、失能與死亡，不是財物損失。'};if(n===1)return{type:'fund',prompt:'若肇事汽車無法查究，受害人的基本人身保障可向哪個機制請求補償？',options:['汽車交通事故特別補償基金','車商保固','道路救援公司','一般財產保險公會'],correctIndex:0,explanation:'符合法定情形時，可由汽車交通事故特別補償基金提供補償。'};return{type:'drunk',prompt:'酒駕造成事故時，對受害人的強制險給付何者較正確？',options:['保險人仍依法給付，但得在給付範圍內代位求償','一律完全不賠','只賠車損','由受害人自行負擔'],correctIndex:0,explanation:'法定酒駕等情形，保險人仍對受害人負給付責任，但可依法代位求償。'}}
async function triggerAccident(id,p,s,ev,risk){s.status='accident';s.questionHandled=false;totalAcc++;let speed=Math.max(20,Number(p.speed||0)),prot=Number(p.protection||2),sf=.65+speed/100,pf=1.35-prot*.12;let medical=Math.min(190000,round1000(rand(18000,65000)*sf*pf));let damage=round1000(rand(12000,70000)*sf*(p.vehicleType==='moto'?.65:1));let q=questionTemplate();q.id=id+'_'+Date.now();q.medical=medical;q.vehicleDamage=damage;q.eventName=ev.name;q.risk=Math.round(risk);s.correctIndex=q.correctIndex;await db.ref(`rooms/${room}/players/${id}`).update({status:'accident',currentEvent:`💥 ${ev.name}發生事故！`,pendingQuestion:q,questionResult:null});log(`${p.name} 發生事故！醫療 ${medical.toLocaleString()}、車損 ${damage.toLocaleString()}`,'acc');renderCars()}
async function resolveQuestion(id,p,s){s.questionHandled=true;let q=p.pendingQuestion,correct=Number(q.answerIndex)===Number(q.correctIndex);let loss=Math.min(45,Math.max(5,Math.round((q.medical||0)/4500)));let moneyNow=Number(p.money??p.moneyStart??0),health=Number(p.health??100),pressure=Number(p.pressure??0),score=Number(p.scoreKnowledge||0),acc=Number(p.accidentCount||0);moneyNow=Math.max(0,moneyNow-Number(q.vehicleDamage||0));health=Math.max(0,health-loss);pressure=Math.min(100,pressure+8);if(correct)score+=10;let result=(correct?'✅ 答對！':'❌ 答錯。')+q.explanation+`｜本次車損 ${Number(q.vehicleDamage||0).toLocaleString()} 元不屬強制險法定人身給付。`;s.status='recovering';s.resumeAt=Date.now()+5500;await db.ref(`rooms/${room}/players/${id}`).update({money:moneyNow,health,pressure,scoreKnowledge:score,accidentCount:acc+1,status:'recovering',questionResult:result,currentEvent:'🏥 事故處理中'});log(`${p.name} ${correct?'答對':'答錯'}保險題，5.5秒後重新上路`,correct?'good':'acc')}
async function finishPlayer(id,p,s){if(s.status==='finished')return;s.status='finished';s.progress=1;let speed=Math.max(1,Number(p.speed||1)),m=String(p.scenarioTime||'').match(/\d+/),deadline=m?Number(m[0]):null,travel=300/speed,late=deadline!=null&&travel>deadline,penalty=late?(3000+(p.scenarioPressure||0)*1000):0;let moneyNow=Math.max(0,Number(p.money??p.moneyStart??0)-penalty);let msg=late?`🏁 抵達，但任務遲到，額外支出 ${penalty.toLocaleString()} 元`:'🏁 準時安全抵達！';await db.ref(`rooms/${room}/players/${id}`).update({progress:1,status:'finished',money:moneyNow,currentEvent:msg});log(`${p.name} ${msg}`,late?'acc':'good')}
async function tick(ts){if(!running)return;let dt=Math.min(120,Math.max(0,ts-(lastTs||ts)));lastTs=ts;let now=Date.now(),writes={};for(let [id,p] of Object.entries(players)){let s=sim[id];if(!s||!p.ready)continue;if(s.status==='recovering'&&now>=s.resumeAt){s.status='driving';s.questionHandled=false;writes[`players/${id}/status`]='driving';writes[`players/${id}/pendingQuestion`]=null;writes[`players/${id}/currentEvent`]='🚗 重新上路'}if(s.status!=='driving')continue;let speed=Math.max(5,Number(p.speed||0));s.progress+=dt*(speed/3000000);for(let i=0;i<nodes.length;i++)if(s.progress>=nodes[i])processNode(id,p,s,i);if(s.progress>=1){s.progress=1;finishPlayer(id,p,s);continue}if(ts-lastWrite>650)writes[`players/${id}/progress`]=s.progress}
 if(Object.keys(writes).length)db.ref(`rooms/${room}`).update(writes);if(ts-lastWrite>650)lastWrite=ts;renderCars();let active=Object.values(sim).some(s=>s.status!=='finished');if(!active&&Object.keys(sim).length){running=false;await db.ref(`rooms/${room}/status`).set('finished');log('本局全部玩家完成！','good');return}requestAnimationFrame(tick)}
init();
</script></body></html>
