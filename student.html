<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>強制險城市大冒險｜學生端</title>
<style>
:root{--deep:#10295a;--blue:#2d8cff;--yellow:#ffd84c;--green:#38c65b;--red:#ef4444;--paper:#fffef5}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(#76d9ff 0 55%,#55ba74 55%);color:#17315f;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:12px}.box{background:var(--paper);border:4px solid var(--deep);border-radius:22px;box-shadow:0 7px 0 rgba(16,41,90,.22);overflow:hidden;margin-bottom:12px}.head{background:linear-gradient(#ffe974,#ffb720);padding:14px 16px;border-bottom:4px solid var(--deep);font-weight:1000;font-size:24px}.body{padding:14px}.hidden{display:none!important}
input{width:100%;padding:13px;border:3px solid #3861a5;border-radius:13px;font-size:17px;font-weight:900;color:#17315f;background:#fff}
button{position:relative;overflow:hidden;border:4px solid var(--deep);border-radius:15px;padding:12px 14px;font-size:16px;font-weight:1000;color:white;background:linear-gradient(#6fd4ff,#258dff);box-shadow:0 5px 0 rgba(16,41,90,.25);cursor:pointer;transition:.15s}
button:not(:disabled){animation:pulse 2s ease-in-out infinite}button:hover:not(:disabled){transform:translateY(-2px) scale(1.01);filter:brightness(1.06)}button:active:not(:disabled){transform:translateY(3px)}button:disabled{opacity:.45;filter:grayscale(.6);cursor:not-allowed;animation:none}@keyframes pulse{50%{filter:brightness(1.08)}}.green{background:linear-gradient(#80ef84,#2ebf4f)}.orange{background:linear-gradient(#ffc164,#f08a18)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.step{background:#eaf2ff;border:2px solid #7595c6;border-radius:10px;padding:8px;text-align:center;font-size:11px;font-weight:900}.step.done{background:#fff2f2;border-color:#d9444d;color:#9a2028;position:relative}.step.done:after{content:"✓";position:absolute;right:-5px;top:-18px;color:#e11d2e;font-size:38px;text-shadow:2px 2px white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vehicle,.role{border:3px solid #315ea5;border-radius:17px;background:#fff;padding:12px}.vehicle.selected,.role.selected{outline:5px solid var(--yellow);background:#fffbe3}.title{font-size:20px;font-weight:1000;margin-bottom:8px}.stars{color:#f3ad00;font-size:18px;letter-spacing:1px}.off{color:#d4dbe4}.stat{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-weight:900;font-size:13px}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.swatch{aspect-ratio:1;padding:0;border-radius:12px}.swatch.sel{outline:4px solid var(--yellow);outline-offset:2px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:450px;overflow:auto}.role{min-height:132px}.role .icon{font-size:28px}.role .meta{color:#5f7090;font-weight:900;font-size:12px;margin:5px 0}.role button{width:100%;padding:8px;font-size:13px}
.card{background:linear-gradient(#fffdf2,#fff1b9);border:4px solid var(--deep);border-radius:19px;padding:17px}.card h3{font-size:25px;margin:0 0 8px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#fff;border:2px solid #d2a83a;border-radius:999px;padding:6px 9px;font-weight:900;font-size:12px}
.speed{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:stretch}.comment{border:3px solid var(--deep);border-radius:14px;padding:12px;background:#e7f4ff;font-weight:900;display:flex;align-items:center}.comment.safe{background:#e3f8e7;color:#25673a}.comment.warn{background:#fff3c0;color:#805c00}.comment.bad{background:#ffdada;color:#9a2222}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum{border:2px solid #7995c0;background:#edf4ff;border-radius:11px;padding:9px;font-size:12px;font-weight:900}.sum b{display:block;color:#214986;margin-bottom:4px}
.wait{text-align:center;padding:26px}.wait .big{font-size:50px;margin-bottom:9px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hud .h{border:3px solid var(--deep);border-radius:13px;padding:9px;text-align:center;background:#fff}.hud .h small{display:block;font-weight:900;color:#678}.hud .h strong{font-size:18px}.event{border:3px solid #8b6c17;background:#fff4b0;border-radius:13px;padding:11px;font-weight:1000;margin-top:10px}.result{border:3px solid #4b9a5b;background:#e7f8e9;border-radius:13px;padding:11px;font-weight:900;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(8,18,42,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}.modalbox{width:min(660px,100%);background:#fffef5;border:5px solid var(--deep);border-radius:22px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.35)}.modal h2{margin:0 0 8px}.acc{background:#ffe1e1;border:3px solid #d04b4b;border-radius:12px;padding:10px;margin:10px 0;font-weight:900;line-height:1.6}.opts{display:grid;gap:8px}.opts button{text-align:left;background:linear-gradient(#7eafff,#3978db)}.opts button.picked{outline:5px solid #ffd84c}.notice{padding:10px;border-radius:10px;background:#fff0b6;border:2px solid #c88e17;font-weight:900;margin-bottom:10px}
@media(max-width:600px){.grid2,.roles,.speed,.summary{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.hud{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="wrap">
<div class="box" id="joinBox"><div class="head">🚘 強制險城市大冒險</div><div class="body"><div class="grid2"><input id="roomInput" maxlength="4" inputmode="numeric" placeholder="房號"><input id="nameInput" maxlength="10" placeholder="姓名／座號"></div><button id="joinBtn" style="width:100%;margin-top:10px">加入遊戲</button><div id="joinMsg" class="notice hidden"></div></div></div>
<div id="setup" class="hidden">
<div class="steps"><div class="step" id="s1">① 車輛</div><div class="step" id="s2">② 角色</div><div class="step" id="s3">③ 情境</div><div class="step" id="s4">④ 時速</div></div>
<div class="box" id="vehicleBox"><div class="head">① 選擇車輛</div><div class="body"><div class="grid2"><div class="vehicle" data-v="car"><div class="title">🚗 汽車</div><div class="stat"><span>防護力</span><span class="stars">★★★★★</span></div><div class="stat"><span>機動性</span><span class="stars">★★<span class="off">★★★</span></span></div><div class="stat"><span>雨天穩定</span><span class="stars">★★★★★</span></div><button data-v="car">選擇汽車</button></div><div class="vehicle" data-v="moto"><div class="title">🛵 機車</div><div class="stat"><span>防護力</span><span class="stars">★★<span class="off">★★★</span></span></div><div class="stat"><span>機動性</span><span class="stars">★★★★★</span></div><div class="stat"><span>雨天穩定</span><span class="stars">★★<span class="off">★★★</span></span></div><button data-v="moto" class="green">選擇機車</button></div></div><div class="colors" id="colors"></div><button id="toRole" disabled style="width:100%">下一步：選角色 →</button></div></div>
<div class="box hidden" id="roleBox"><div class="head">② 選擇角色</div><div class="body"><div class="roles" id="roles"></div><button id="toScenario" disabled style="width:100%;margin-top:10px">下一步：抽情境卡 →</button></div></div>
<div class="box hidden" id="scenarioBox"><div class="head">③ 抽情境卡</div><div class="body"><div class="card" id="scenarioCard"><h3>?</h3><div>尚未抽卡</div></div><button id="drawBtn" class="orange" style="width:100%;margin-top:10px">🎴 抽一張情境卡</button><div id="speedArea" class="hidden"><div class="speed" style="margin-top:12px"><input id="speedInput" type="number" min="0" max="160" placeholder="時速 km/h"><div id="speedComment" class="comment">請輸入時速</div></div><button id="readyBtn" class="green" disabled style="width:100%;margin-top:10px">✅ 準備完成</button></div></div></div>
<div class="box"><div class="head">你的選擇</div><div class="body summary"><div class="sum"><b>車輛</b><span id="sumV">尚未選擇</span></div><div class="sum"><b>角色</b><span id="sumR">尚未選擇</span></div><div class="sum"><b>情境</b><span id="sumS">尚未抽卡</span></div><div class="sum"><b>時速</b><span id="sumSpeed">尚未設定</span></div></div></div>
</div>
<div class="box hidden" id="waitBox"><div class="head">READY</div><div class="wait"><div class="big">🚦</div><h2>等待老師發車</h2><div id="waitInfo"></div></div></div>
<div class="box hidden" id="liveBox"><div class="head">行車中</div><div class="body"><div class="hud"><div class="h"><small>時速</small><strong id="hSpeed">0</strong></div><div class="h"><small>積分</small><strong id="hScore">0</strong></div><div class="h"><small>健康</small><strong id="hHealth">100</strong></div><div class="h"><small>壓力</small><strong id="hPressure">0</strong></div><div class="h"><small>事故</small><strong id="hAcc">0</strong></div><div class="h"><small>答對</small><strong id="hCorrect">0</strong></div></div><div class="event" id="eventBox">準備出發</div><div class="result hidden" id="resultBox"></div></div></div>
</div>
<div class="modal hidden" id="qModal"><div class="modalbox"><h2>💥 全班事故題</h2><div class="acc" id="accInfo"></div><h3 id="qPrompt"></h3><div class="opts" id="qOpts"></div><div id="answerWait" class="notice hidden" style="margin-top:10px">已送出答案，等待老師公布。</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="game-data.js"></script>
<script>
let db,auth,uid,room,state={vehicle:null,color:'#3b82f6',role:null,scenario:null,speed:null},playerRef,currentQuestionId='',answeredQuestionId='';const $=id=>document.getElementById(id);
function configOK(){return window.GAME_FIREBASE_CONFIG&&!String(GAME_FIREBASE_CONFIG.apiKey).includes('PASTE_')}function scrollToEl(el){requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'start'}))}
async function init(){if(!configOK()){$('joinMsg').textContent='請先設定 Firebase';$('joinMsg').classList.remove('hidden');$('joinBtn').disabled=true;return}firebase.initializeApp(GAME_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();await auth.signInAnonymously();uid=auth.currentUser.uid;let saved=JSON.parse(localStorage.getItem('insuranceGamePlayer')||'null');if(saved){$('roomInput').value=saved.room||'';$('nameInput').value=saved.name||''}}
function renderColors(){$('colors').innerHTML=GAME.colors.map(c=>`<button class="swatch ${c.hex===state.color?'sel':''}" data-c="${c.hex}" style="background:${c.hex}"></button>`).join('');document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{state.color=b.dataset.c;renderColors();updateSummary()})}
function renderRoles(){$('roles').innerHTML=GAME.roles.map(r=>`<div class="role ${state.role===r.id?'selected':''}" data-r="${r.id}"><div class="icon">${r.icon}</div><div class="title">${r.name}</div><div class="meta">專屬情境卡 5 張</div><div style="font-size:12px;font-weight:900;color:#657">${r.desc}</div><button data-r="${r.id}">選擇</button></div>`).join('');document.querySelectorAll('.role button').forEach(b=>b.onclick=()=>{state.role=b.dataset.r;renderRoles();$('toScenario').disabled=false;$('s2').classList.add('done');updateSummary()})}
function updateSummary(){let v=state.vehicle?GAME.getVehicle(state.vehicle):null,r=state.role?GAME.getRole(state.role):null;$('sumV').textContent=v?GAME.colorName(state.color)+v.name:'尚未選擇';$('sumR').textContent=r?r.name:'尚未選擇';$('sumS').textContent=state.scenario?state.scenario.title:'尚未抽卡';$('sumSpeed').textContent=state.speed!=null?state.speed+' km/h':'尚未設定'}
document.querySelectorAll('.vehicle button').forEach(b=>b.onclick=()=>{state.vehicle=b.dataset.v;document.querySelectorAll('.vehicle').forEach(x=>x.classList.toggle('selected',x.dataset.v===state.vehicle));$('toRole').disabled=false;$('s1').classList.add('done');updateSummary()});$('toRole').onclick=()=>{$('roleBox').classList.remove('hidden');renderRoles();scrollToEl($('roleBox'))};$('toScenario').onclick=()=>{$('scenarioBox').classList.remove('hidden');scrollToEl($('scenarioBox'))};
$('drawBtn').onclick=()=>{if(state.scenario||!state.role)return;let r=GAME.getRole(state.role);state.scenario=r.scenarios[Math.floor(Math.random()*r.scenarios.length)];$('scenarioCard').innerHTML=`<h3>${state.scenario.title}</h3><div>${state.scenario.text}</div><div class="chips"><span class="chip">⏱ ${state.scenario.time}</span><span class="chip">⚠ ${state.scenario.stakes}</span></div>`;$('drawBtn').disabled=true;$('drawBtn').textContent='已抽取情境卡';document.querySelectorAll('.role button').forEach(b=>b.disabled=true);$('toScenario').disabled=true;$('speedArea').classList.remove('hidden');$('s3').classList.add('done');updateSummary()};
$('speedInput').oninput=e=>{let raw=e.target.value;if(raw===''){state.speed=null;$('speedComment').textContent='請輸入時速';$('speedComment').className='comment';$('readyBtn').disabled=true;updateSummary();return}let v=Math.max(0,Math.min(160,Number(raw)));e.target.value=v;state.speed=v;$('speedComment').textContent=GAME.speedComment(v);$('speedComment').className='comment '+(v<=30?'safe':v<=60?'':v<100?'warn':'bad');$('readyBtn').disabled=false;$('s4').classList.add('done');updateSummary()};
$('joinBtn').onclick=async()=>{room=$('roomInput').value.trim();let name=$('nameInput').value.trim();if(!/^\d{4}$/.test(room)||!name){$('joinMsg').textContent='請輸入4位數房號與姓名';$('joinMsg').classList.remove('hidden');return}let snap=await db.ref(`rooms/${room}/status`).once('value');if(!snap.exists()){$('joinMsg').textContent='找不到這個房間';$('joinMsg').classList.remove('hidden');return}localStorage.setItem('insuranceGamePlayer',JSON.stringify({room,name}));playerRef=db.ref(`rooms/${room}/players/${uid}`);await playerRef.update({name,connected:true,ready:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});playerRef.onDisconnect().update({connected:false});$('joinBox').classList.add('hidden');$('setup').classList.remove('hidden');renderColors();watchRoom()};
$('readyBtn').onclick=async()=>{if(!state.vehicle||!state.role||!state.scenario||state.speed==null)return;let v=GAME.getVehicle(state.vehicle),r=GAME.getRole(state.role);await playerRef.update({name:$('nameInput').value.trim(),vehicleType:state.vehicle,color:state.color,protection:v.protection,mobility:v.mobility,rainStability:v.rainStability,economy:v.economy,roleId:r.id,roleName:r.name,scenarioTitle:state.scenario.title,scenarioText:state.scenario.text,scenarioTime:state.scenario.time,scenarioStakes:state.scenario.stakes,scenarioPressure:state.scenario.pressure||0,scenarioDistraction:state.scenario.distraction||0,speed:Number(state.speed),ready:true,status:'ready',score:0,health:100,pressure:0,accidentCount:0,insuranceCorrect:0,currentEvent:'等待出發',updatedAt:firebase.database.ServerValue.TIMESTAMP});$('setup').classList.add('hidden');$('waitBox').classList.remove('hidden');$('waitInfo').textContent=`${GAME.colorName(state.color)}${v.name}｜${r.name}｜${state.speed} km/h`};
function watchRoom(){db.ref(`rooms/${room}/status`).on('value',s=>{let st=s.val();if(st==='running'||st==='question'){$('waitBox').classList.add('hidden');$('setup').classList.add('hidden');$('liveBox').classList.remove('hidden')}if(st==='finished')$('eventBox').textContent='⏹️ 老師已結束本局'});playerRef.on('value',s=>{let p=s.val();if(p)renderLive(p)});db.ref(`rooms/${room}/globalQuestion`).on('value',s=>handleGlobalQuestion(s.val()))}
function renderLive(p){$('hSpeed').textContent=(p.speed||0)+' km/h';$('hScore').textContent=p.score||0;$('hHealth').textContent=p.health??100;$('hPressure').textContent=p.pressure??0;$('hAcc').textContent=p.accidentCount||0;$('hCorrect').textContent=p.insuranceCorrect||0;$('eventBox').textContent=p.currentEvent||'行駛中';if(p.lastFeedback){$('resultBox').classList.remove('hidden');$('resultBox').textContent=p.lastFeedback}else $('resultBox').classList.add('hidden')}
function handleGlobalQuestion(q){if(!q){$('qModal').classList.add('hidden');currentQuestionId='';return}currentQuestionId=q.id;if(q.closed){$('qModal').classList.add('hidden');return}$('qModal').classList.remove('hidden');$('accInfo').innerHTML=(q.accidentSummary||'').replace(/\n/g,'<br>');$('qPrompt').textContent=q.prompt||'';$('qOpts').innerHTML=(q.options||[]).map((o,i)=>`<button data-i="${i}" ${(answeredQuestionId===q.id||q.revealed)?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('');$('answerWait').classList.toggle('hidden',answeredQuestionId!==q.id&&!q.revealed);if(answeredQuestionId!==q.id&&!q.revealed){document.querySelectorAll('#qOpts button').forEach(b=>b.onclick=async()=>{answeredQuestionId=q.id;document.querySelectorAll('#qOpts button').forEach(x=>{x.disabled=true;x.classList.toggle('picked',x===b)});$('answerWait').classList.remove('hidden');$('answerWait').textContent='已送出答案，等待老師公布。';await db.ref(`rooms/${room}/globalQuestion/answers/${uid}`).set({option:Number(b.dataset.i),name:$('nameInput').value.trim(),ts:firebase.database.ServerValue.TIMESTAMP})})}if(q.revealed){let ans=q.answers&&q.answers[uid];let msg=!ans?'未作答。':Number(ans.option)===Number(q.correctIndex)?'✅ 答對！':'❌ 答錯。';$('answerWait').classList.remove('hidden');$('answerWait').textContent=msg+' '+(q.explanation||'')}}
renderColors();init();
</script></body></html>
